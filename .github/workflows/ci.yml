name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number for a repair dispatch
        type: string
        default: ''
      expected-head-sha:
        description: Exact repaired PR commit
        type: string
        default: ''
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: engels74/automation/actions/dispatch-guard@v1.0.0
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          expected-head-sha: ${{ inputs.expected-head-sha }}
  assets:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.10'
          enable-cache: true
      - name: Validate PNG structure and pixels
        run: uv run --no-project --with-requirements .github/requirements.txt python .github/scripts/check-assets.py
      - name: Parse the mosaic helper without executing it
        run: php -l utilities/generate-all-logos-mosaics.php
      - run: git diff --exit-code HEAD
  required:
    name: ci / required
    if: always()
    needs: [guard, assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: engels74/automation/actions/dispatch-guard@v1.0.0
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          expected-head-sha: ${{ inputs.expected-head-sha }}
      - uses: engels74/automation/actions/gate@v1.0.0
        with:
          needs: ${{ toJSON(needs) }}
          required: guard assets
